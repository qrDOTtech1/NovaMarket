{% extends "base.html" %}
{% block title %}Inscription — NovaMarket{% endblock %}
{% block extra_head %}
<style>
  .auth-wrap {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    background: var(--nova-surface);
    border: 1px solid var(--nova-border);
    border-radius: 14px;
    padding: 2rem 1.75rem;
  }
  .auth-logo { text-align: center; font-size: 2rem; margin-bottom: .5rem; }
  .auth-title { text-align: center; font-size: 1.3rem; font-weight: 700; margin-bottom: .25rem; }
  .auth-sub { text-align: center; color: var(--nova-muted); font-size: .82rem; margin-bottom: 1.75rem; }
  .auth-footer { text-align: center; color: var(--nova-muted); font-size: .82rem; margin-top: 1.25rem; }
  .auth-footer a { color: var(--nova-teal-l); text-decoration: none; }
  .password-hint { font-size: .72rem; color: var(--nova-muted); margin-top: .25rem; }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">🟢</div>
    <div class="auth-title">Créer un compte</div>
    <div class="auth-sub">Commence à trader Polymarket avec l'IA</div>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Pseudo</label>
        <input class="form-control" type="text" name="username"
               placeholder="satoshi" maxlength="50" autocomplete="username" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" name="email"
               placeholder="user@example.com" autocomplete="email" required/>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input class="form-control" type="password" name="password"
               placeholder="••••••••" minlength="8" autocomplete="new-password" required/>
        <div class="password-hint">Minimum 8 caractères</div>
      </div>
      <button type="submit" class="btn btn-primary w-full mt-1">Créer mon compte</button>
    </form>

    <div class="auth-footer">
      Déjà un compte ?
      <a href="{{ url_for('login') }}">Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}
